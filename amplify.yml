version: 0.1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install
        - nvm use
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build

    start:
      commands:
        - npm start

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
